    patch:
      operationId: updateOperation
      tags: [inventory]
      summary: Edit a draft operation
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationUpdate" }
      responses:
        "200":
          description: Updated operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
    delete:
      operationId: deleteOperation
      tags: [inventory]
      summary: Delete a draft operation
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "409": { description: Only draft operations can be deleted }
  /operations/{id}/validate:
    post:
      operationId: validateOperation
