        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationInput" }
      responses:
        "201":
          description: Created operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
  /operations/{id}:
    get:
      operationId: getOperation
      tags: [inventory]
      summary: Get operation details
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
