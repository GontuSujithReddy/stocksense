      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Completed operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "409": { description: Insufficient stock or operation cannot be completed }
  /operations/{id}/cancel:
    post:
      operationId: cancelOperation
      tags: [inventory]
      summary: Cancel an operation that has not been completed
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Canceled operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
  /operations/{id}/delivery/start:
    post:
      operationId: startDelivery
      tags: [inventory]
      summary: Assigned courier records when a validated delivery leaves
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Delivery started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierDelivery" }
        "409": { description: Delivery must be validated and not already started }
  /operations/{id}/delivery/reach:
    post:
      operationId: reachDelivery
      tags: [inventory]
      summary: Courier records arrival and sends a one-time code to the customer
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Arrival recorded and the customer OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierDelivery" }
        "409": { description: "Delivery must be started, have a customer email, and remain incomplete" }
        "429": { description: Code resend cooldown or send limit reached }
  /operations/{id}/delivery/complete:
    post:
      operationId: completeDelivery
      tags: [inventory]
      summary: Assigned courier records when a started delivery reaches its recipient
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryOtpInput" }
      responses:
        "200":
          description: Delivery completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierDelivery" }
        "409": { description: "Delivery must be started, reached, and not already completed; the code must be current" }
        "429": { description: Too many incorrect code attempts }
  /operations/{id}/courier:
    put:
      operationId: assignDeliveryCourier
      tags: [inventory]
      summary: Owner assigns or removes a courier for a delivery
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryCourierInput" }
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { description: Verified courier account not found }
        "409": { description: Delivery already started or not owned by this workspace }
  /courier/deliveries:
    get:
      operationId: listCourierDeliveries
      tags: [inventory]
      summary: List only deliveries assigned to the signed-in courier
      responses:
        "200":
          description: Assigned deliveries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CourierDelivery" }
  /courier/deliveries/{id}:
    get:
      operationId: getCourierDelivery
      tags: [inventory]
      summary: View an assigned delivery
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Assigned delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierDelivery" }
        "404": { description: Not assigned }
  /courier/deliveries/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: listCourierDeliveryMessages
      tags: [inventory]
      summary: Read the chat for an assigned delivery
      responses:
        "200":
          description: Delivery chat messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliveryChatMessage" }
        "404": { description: Delivery is not assigned to this courier }
    post:
      operationId: sendCourierDeliveryMessage
      tags: [inventory]
      summary: Send a courier message to the customer and email a private chat link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryChatMessageInput" }
      responses:
        "200":
          description: Message saved and customer email notification attempted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryChatPostResult" }
        "404": { description: Delivery is not assigned to this courier }
        "409": { description: The delivery chat is closed }
  /delivery-chat:
    get:
      operationId: getCustomerDeliveryChat
      tags: [inventory]
      security: []
      parameters:
        - in: header
          name: X-Delivery-Chat-Token
          required: true
          schema: { type: string, minLength: 40, maxLength: 100 }
      responses:
        "200":
          description: Private delivery chat thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryChatThread" }
        "404": { description: Chat link is invalid or expired }
    post:
      operationId: sendCustomerDeliveryMessage
      tags: [inventory]
      security: []
      parameters:
        - in: header
          name: X-Delivery-Chat-Token
          required: true
          schema: { type: string, minLength: 40, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryChatMessageInput" }
      responses:
        "201":
          description: Customer message saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryChatMessage" }
        "404": { description: Chat link is invalid or expired }
        "409": { description: Delivery chat is closed }
  /moves:
    get:
      operationId: listMoves
      tags: [inventory]
      summary: Browse the stock movement ledger
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: warehouseId
          schema: { type: integer }
        - in: query
          name: productId
          schema: { type: integer }
        - in: query
          name: type
          schema: { $ref: "#/components/schemas/OperationType" }
      responses:
        "200":
          description: Stock movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockMove" }
  /memory/recall:
    post:
      operationId: recallMemory
      tags: [memory]
      summary: Recall memories for the signed-in inventory owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryRecallInput" }
      responses:
        "200":
          description: Matching memories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryRecall" }
        "400": { description: Invalid or empty query }
        "401": { description: Sign-in required }
        "404": { description: Memory bank not found }
        "502": { description: Hindsight recall failed }
        "503": { description: Hindsight is not configured }
        "504": { description: Hindsight did not respond in time }
components:
  schemas:
    StocksenseAdminAccess:
      type: object
      required: [isMainAdmin, status, requestStatus, accessStatus, displayName, requestCreatedAt]
      properties:
        isMainAdmin: { type: boolean }
        status: { type: string, enum: [main_admin, none, pending, denied, active, inactive, terminated] }
        requestStatus: { type: ["string", "null"], enum: [pending, accepted, denied] }
        accessStatus: { type: ["string", "null"], enum: [active, inactive, terminated] }
        displayName: { type: ["string", "null"] }
        requestCreatedAt: { type: ["string", "null"], format: date-time }
    StocksenseAdminAccessRequestInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, pattern: "^[0-9]{10}$" }
    StocksenseAdminAccessRequestDecision:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, denied] }
    StocksenseAdminAccountStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, inactive] }
    StocksenseAdminAccount:
      type: object
      required: [userId, requestedAt, requestStatus, reviewedAt, reviewedByUserId, accessStatus, accessChangedAt, accessChangedByUserId, terminatedAt, terminatedByUserId, displayName, verifiedEmail, phone]
      properties:
        userId: { type: string }
        requestedAt: { type: string, format: date-time }
        requestStatus: { type: string, enum: [pending, accepted, denied] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        reviewedByUserId: { type: ["string", "null"] }
        accessStatus: { type: ["string", "null"], enum: [active, inactive, terminated] }
        accessChangedAt: { type: ["string", "null"], format: date-time }
        accessChangedByUserId: { type: ["string", "null"] }
        terminatedAt: { type: ["string", "null"], format: date-time }
        terminatedByUserId: { type: ["string", "null"] }
        displayName: { type: string }
        verifiedEmail: { type: string, format: email }
        phone: { type: string }
    StocksenseAdminAccountCounts:
      type: object
      required: [pending, accepted, denied, active, inactive, terminated]
      properties:
        pending: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        denied: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        inactive: { type: integer, minimum: 0 }
        terminated: { type: integer, minimum: 0 }
    StocksenseAdminAccountList:
      type: object
      required: [counts, accounts]
      properties:
        counts: { $ref: "#/components/schemas/StocksenseAdminAccountCounts" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/StocksenseAdminAccount" }
    StocksenseAccountStatus:
      type: object
      required: [deleted, canDelete]
      properties:
        deleted: { type: boolean }
        canDelete: { type: boolean }
    DeliveryRecipientInput:
      type: object
      required: [customerPhone, deliveryAddress]
      properties:
        customerPhone: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
        deliveryAddress: { type: string, maxLength: 500 }
    DeliveryCallInput:
      type: object
      required: [consent]
      properties:
        consent: { type: boolean }
    DeliveryVoiceInput:
      type: object
      required: [fromNumber]
      properties:
        fromNumber: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
    DeliverySupportInput:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        operationId: { type: ["integer", "null"] }
    DeliverySupportStaffUpdate:
      type: object
      required: [resolution, status]
      properties:
        resolution: { type: string, minLength: 1, maxLength: 4000 }
        status: { type: string, enum: [open, closed] }
    StocksenseSupportAdminAccess:
      type: object
      required: [canReview]
      properties:
        canReview: { type: boolean }
    StocksenseSupportAccess:
      type: object
      required: [status, profileComplete, displayName, phone, requestCreatedAt]
      properties:
        status: { type: string, enum: [none, pending, approved, denied, paused] }
        profileComplete: { type: boolean }
        displayName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        requestCreatedAt: { type: ["string", "null"], format: date-time }
    StocksenseSupportAccessRequest:
      type: object
      required: [userId, requestedAt, notificationSentAt, status, reviewedAt, reviewedByUserId, pausedAt, pausedByUserId, ticketsReviewed, displayName, verifiedEmail, phone]
      properties:
        userId: { type: string }
        requestedAt: { type: string, format: date-time }
        notificationSentAt: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [pending, approved, denied] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        reviewedByUserId: { type: ["string", "null"] }
        pausedAt: { type: ["string", "null"], format: date-time }
