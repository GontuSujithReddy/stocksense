openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StockSense inventory management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: inventory
  - name: memory
  - name: support
  - name: administration
paths:
  /delivery-app/profile:
    get:
      operationId: getDeliveryProfile
      tags: [inventory]
      responses:
        "200":
          description: Current signed-in delivery app profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryProfile" }
    put:
      operationId: saveDeliveryProfile
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryProfile" }
  /delivery-app/courier-lookup:
    get:
      operationId: lookupRegisteredCourier
      tags: [inventory]
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Registered courier matching verified email; 404 if none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredCourier" }
  /delivery-app/tracking:
    get:
      operationId: listDeliveryTracking
      tags: [inventory]
      responses:
        "200":
          description: Only owned or assigned deliveries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliveryTracking" }
  /delivery-app/tracking/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getDeliveryTracking
      tags: [inventory]
      responses:
        "200":
          description: Persisted tracking and provider-verified customer response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryTracking" }
    put:
      operationId: saveDeliveryRecipient
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryRecipientInput" }
      responses:
        "200":
          description: Saved recipient; requires customer confirmation for completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryTracking" }
  /delivery-app/tracking/{id}/call:
    post:
      operationId: callDeliveryCustomer
      tags: [inventory]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryCallInput" }
      responses:
        "200":
          description: Real paid Retell call initiated; errors never fabricate approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryTracking" }
  /delivery-app/voice:
    get:
      operationId: getDeliveryVoiceSettings
      tags: [inventory]
      responses:
        "200":
          description: Existing Retell phone numbers and saved dedicated agent; provider error when unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryVoiceSettings" }
    post:
      operationId: setupDeliveryVoice
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryVoiceInput" }
      responses:
        "200":
          description: Dedicated DTMF delivery agent created; no numbers purchased and no calls made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryVoiceSettings" }
  /delivery-app/support:
    get:
      operationId: listDeliverySupport
      tags: [inventory]
      responses:
        "200":
          description: Persisted support requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliverySupport" }
    post:
      operationId: createDeliverySupport
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverySupportInput" }
      responses:
        "201":
          description: Saved request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySupport" }
  /delivery-app/support/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: createDeliverySupportMessage
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverySupportMessageInput" }
      responses:
        "201":
          description: Added to the customer's own ticket conversation; does not change ticket status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySupportConversationMessage" }
  /delivery-app/support/staff:
    get:
      operationId: listDeliveryStaffSupport
      tags: [inventory]
      responses:
        "200":
          description: All customer support tickets; restricted to explicitly authorized support staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliverySupportStaffTicket" }
  /delivery-app/support/staff/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateDeliveryStaffSupport
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverySupportStaffUpdate" }
      responses:
        "200":
          description: Updated customer reply and ticket status; restricted to explicitly authorized support staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySupportStaffTicket" }
  /delivery-app/support/staff-members:
    get:
      operationId: listDeliverySupportStaffMembers
      tags: [inventory]
      responses:
        "200":
          description: Current support-staff roster; restricted to support administrators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeliverySupportStaffMember" }
    post:
      operationId: addDeliverySupportStaffMember
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverySupportStaffMemberInput" }
      responses:
        "201":
          description: Account added to the support-staff roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySupportStaffMember" }
  /delivery-app/support/staff-members/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    delete:
      operationId: removeDeliverySupportStaffMember
      tags: [inventory]
      responses:
        "204":
          description: Account removed from the support-staff roster
  /support/access:
    get:
      operationId: getStocksenseSupportAccess
      tags: [support]
      responses:
        "200":
          description: The signed-in account's support application and access state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportAccess" }
  /support/admin/access:
    get:
      operationId: getStocksenseSupportAdminAccess
      tags: [support]
      responses:
        "200":
          description: Whether the signed-in account matches the configured StockSense administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportAdminAccess" }
  /support/admin/access-requests:
    get:
      operationId: listStocksenseSupportAccessRequests
      tags: [support]
      responses:
        "200":
          description: StockSense access requests visible to the configured, email-verified administrator
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StocksenseSupportAccessRequest" }
        "403": { description: Only the configured StockSense administrator can review requests }
  /support/admin/access-requests/{userId}:
    patch:
      operationId: reviewStocksenseSupportAccessRequest
      tags: [support]
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseSupportAccessReviewInput" }
      responses:
        "200":
          description: Request decision saved; approval authorizes StockSense support only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportAccessRequest" }
        "403": { description: Only the configured StockSense administrator can review requests }
        "404": { description: Access request not found }
        "409": { description: Request already reviewed or requester profile incomplete }
  /support/admin/access-requests/{userId}/pause:
    patch:
      operationId: setStocksenseSupportAccessPaused
      tags: [support]
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseSupportAccessPauseInput" }
      responses:
        "200":
          description: StockSense support access pause state saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportAccessRequest" }
        "403": { description: Only the configured StockSense administrator can change support access }
        "404": { description: Access request not found }
        "409": { description: Only accepted support accounts can be paused or reactivated }
  /support/access-request:
    post:
      operationId: requestStocksenseSupportAccess
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseSupportAccessRequestInput" }
      responses:
        "200":
          description: Access request saved; approval is still administrator-controlled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportAccessRequestResponse" }
        "502": { description: "The access request was saved, but the administrator email could not be sent" }
  /admin/access:
    get:
      operationId: getStocksenseAdminAccess
      tags: [administration]
      responses:
        "200":
          description: The signed-in account's Admin request and lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseAdminAccess" }
  /admin/access-request:
    post:
      operationId: requestStocksenseAdminAccess
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseAdminAccessRequestInput" }
      responses:
        "200":
          description: Admin access request saved; access remains pending until approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseAdminAccess" }
        "403": { description: A verified email or eligible StockSense account is required }
        "409": { description: This account already has a different StockSense role or Admin state }
  /admin/accounts:
    get:
      operationId: listStocksenseAdminAccounts
      tags: [administration]
      responses:
        "200":
          description: Admin requests and lifecycle counts visible only to the configured main administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseAdminAccountList" }
        "403": { description: Only the configured main administrator can view Admin accounts }
  /admin/accounts/{userId}/review:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    patch:
      operationId: reviewStocksenseAdminAccount
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseAdminAccessRequestDecision" }
      responses:
        "200":
          description: Admin request reviewed; approval provisions an Owner profile in that account's own workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseAdminAccount" }
        "403": { description: Only the configured main administrator can review Admin requests }
        "404": { description: Admin request not found }
        "409": { description: Request already reviewed or account cannot be safely provisioned }
  /admin/accounts/{userId}/status:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    patch:
      operationId: setStocksenseAdminAccountStatus
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseAdminAccountStatusInput" }
      responses:
        "200":
          description: Accepted Admin account activated or deactivated without deleting its workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseAdminAccount" }
        "403": { description: Only the configured main administrator can change Admin account status }
        "404": { description: Admin account not found }
        "409": { description: "Only accepted, non-terminated Admin accounts can change status" }
  /admin/accounts/{userId}/terminate:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    post:
      operationId: terminateStocksenseAdminAccount
      tags: [administration]
      responses:
        "200":
          description: Admin access permanently revoked and retained as a named Terminated record; workspace data is preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseAdminAccount" }
        "403": { description: Only the configured main administrator can terminate Admin access }
        "404": { description: Admin account not found }
        "409": { description: "Only accepted, non-terminated Admin accounts can be terminated" }
  /stocksense/account:
    get:
      operationId: getStocksenseAccountStatus
      tags: [inventory]
      responses:
        "200":
          description: Deletion status for the signed-in account; only owners can permanently delete their account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseAccountStatus" }
        "401": { description: Sign-in required }
    delete:
      operationId: deleteStocksenseAccount
      tags: [inventory]
      summary: Permanently delete the signed-in owner's account
      description: Deletes the owner's StockSense data and memory bank, shared sign-in, and Delivery profile/settings. Retains Delivery-linked operational history and prevents StockSense workspace access. Retries safely resume incomplete provider and storage cleanup.
      responses:
        "204": { description: "StockSense data, shared sign-in, and Delivery profile/settings deleted; Delivery-linked operational history retained" }
        "401": { description: Sign-in required }
        "403": { description: Only an owner can delete their account }
        "409": { description: "Deletion is blocked while the configured main administrator remains; prior cleanup steps remain committed if deletion had already started" }
        "500": { description: Local database cleanup did not complete; retry is safe }
        "502": { description: "Hindsight, App Storage, or Clerk deletion could not be confirmed; retry to finish" }
        "503": { description: "Hindsight is not configured or account administrator status could not be verified; no new cleanup steps were run" }
        "504": { description: Hindsight did not confirm memory deletion; local database cleanup did not start }
  /support/tickets:
    get:
      operationId: listStocksenseSupportTickets
      tags: [support]
      responses:
        "200":
          description: Tickets owned by the signed-in StockSense owner only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StocksenseSupportTicket" }
    post:
      operationId: createStocksenseSupportTicket
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseSupportTicketInput" }
      responses:
        "201":
          description: Created owner ticket with its initial conversation message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportTicket" }
  /support/tickets/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: createStocksenseSupportOwnerMessage
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseSupportMessageInput" }
      responses:
        "201":
          description: Appended to the owner's ticket thread without changing its status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportMessage" }
        "404": { description: Ticket is not owned by the signed-in owner }
  /support/tickets/{id}/resolve:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: confirmStocksenseSupportResolved
      tags: [support]
      responses:
        "200":
          description: Owner-confirmed resolution, recorded exactly once for the assigned staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportTicket" }
        "409": { description: Ticket must be assigned and unresolved before owner confirmation }
        "404": { description: Ticket is not owned by the signed-in owner }
  /support/staff/tickets:
    get:
      operationId: listStocksenseSupportStaffTickets
      tags: [support]
      responses:
        "200":
          description: Shared StockSense support queue for approved staff with completed profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StocksenseSupportStaffTicket" }
        "403": { description: Staff access is not approved }
        "409": { description: Approved staff profile needs valid contact details }
  /support/staff/tickets/{id}/claim:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: claimStocksenseSupportTicket
      tags: [support]
      responses:
        "200":
          description: Ticket assigned to the authenticated staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportStaffTicket" }
        "409": { description: Ticket was already assigned or is no longer open }
  /support/staff/tickets/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: createStocksenseSupportStaffMessage
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StocksenseSupportMessageInput" }
      responses:
        "201":
          description: Appended to the assigned open ticket without changing its status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportMessage" }
        "403": { description: Only the assigned staff member may reply }
        "404": { description: Ticket not found }
  /support/staff/summary:
    get:
      operationId: getStocksenseSupportStaffSummary
      tags: [support]
      responses:
        "200":
          description: Owner-confirmed solved-ticket count for the signed-in staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StocksenseSupportStaffSummary" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storefront/settings:
    get:
      operationId: getStorefrontSettings
      tags: [inventory]
      summary: Get the signed-in seller's storefront settings and fulfillment locations
      responses:
        "200":
          description: Storefront settings and locations owned by the signed-in seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontSettings" }
    put:
      operationId: updateStorefrontSettings
      tags: [inventory]
      summary: Publish, edit, or unpublish the signed-in seller's storefront
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontSettingsInput" }
      responses:
        "200":
          description: Saved storefront settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontSettings" }
        "409": { description: Storefront URL is already in use }
  /storefront/builder:
    get:
      operationId: getStorefrontBuilder
      tags: [inventory]
      summary: Get the signed-in seller's store draft, published design, and locations
      responses:
        "200":
          description: Store builder state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontBuilder" }
  /storefront/builder/generate:
    post:
      operationId: generateStorefrontDesign
      tags: [inventory]
      summary: Generate a validated storefront design draft from a seller prompt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontDesignPrompt" }
      responses:
        "200":
          description: Suggested design, not yet saved or published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontDesign" }
        "502": { description: Design generation failed }
  /storefront/builder/generate-hero:
    post:
      operationId: generateStorefrontHero
      tags: [inventory]
      summary: Generate a hero image for the seller's store draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontHeroPrompt" }
      responses:
        "201":
          description: Generated image asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontHeroResult" }
        "502": { description: Image generation failed }
  /storefront/builder/draft:
    put:
      operationId: saveStorefrontDraft
      tags: [inventory]
      summary: Save a seller-approved edit to the unpublished storefront draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontDesign" }
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontBuilder" }
  /storefront/builder/publish:
    post:
      operationId: publishStorefront
      tags: [inventory]
      summary: Publish the seller-approved storefront draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontPublishInput" }
      responses:
        "200":
          description: Published storefront
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontBuilder" }
        "409": { description: Store URL is already in use }
  /storefront/analytics:
    get:
      operationId: getStorefrontAnalytics
      tags: [inventory]
      summary: Read owner-scoped storefront order-request analytics
      parameters:
        - in: query
          name: periodDays
          schema: { type: integer, minimum: 1, maximum: 36500, default: 30 }
      responses:
        "200":
          description: Order requests and requested value, grouped by currency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontAnalytics" }
  /storefront/assets/upload-url:
    post:
      operationId: requestStorefrontAssetUpload
      tags: [inventory]
      summary: Request a private upload URL for a storefront image
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontAssetUploadInput" }
      responses:
        "200":
          description: Presigned upload URL and owner-scoped asset ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontAssetUploadResult" }
  /storage/assets/{assetId}:
    parameters:
      - { in: path, name: assetId, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getOwnerStorefrontAsset
      tags: [inventory]
      summary: Read a storefront image owned by the signed-in seller
      responses:
        "200":
          description: Image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: Image not found }
  /storage/public-objects/{filePath}:
    parameters:
      - { in: path, name: filePath, required: true, schema: { type: string } }
    get:
      operationId: getPublicStorageObject
      tags: [inventory]
      summary: Read a public object-storage asset
      responses:
        "200":
          description: Public object bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { description: File not found }
  /storefronts/{slug}:
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])?$" } }
    get:
      operationId: getPublicStorefront
      tags: [inventory]
      summary: Read a published seller storefront and its live stock
      responses:
        "200":
          description: Public catalog for the requested seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStorefront" }
        "404": { description: Storefront is not published }
  /storefronts/{slug}/assets/{assetId}:
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])?$" } }
      - { in: path, name: assetId, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getPublicStorefrontAsset
      tags: [inventory]
      summary: Read an image referenced by a published storefront
      responses:
        "200":
          description: Public storefront image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: Image not found }
  /storefronts/{slug}/orders:
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])?$" } }
    post:
      operationId: createPublicStorefrontOrder
      tags: [inventory]
      summary: Create a delivery operation from an online order request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontOrderInput" }
      responses:
        "201":
          description: Order saved as a delivery operation for seller review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontOrderResult" }
        "400": { description: Order details or quantities are invalid }
        "404": { description: Storefront is not published }
        "409": { description: Requested stock is no longer available }
        "429": { description: Order request limit reached }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [inventory]
      summary: Get inventory dashboard totals and recent activity
      parameters:
        - in: query
